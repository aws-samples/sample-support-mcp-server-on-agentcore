AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AWS Support MCP Server hosted on Amazon Bedrock AgentCore (Runtime + Gateway).
  Lets Kiro users open/track AWS Support cases without IAM credentials or Console
  access: Kiro authenticates the developer against your identity provider (OAuth 2.0
  PKCE) - a corporate OIDC IdP, or a Cognito user pool created by this template that
  can federate to IAM Identity Center (SAML 2.0) - AgentCore Gateway validates the JWT,
  and a single execution role holds the Support API permissions. Requires a Business/
  Enterprise On-Ramp/Enterprise Support plan on this account for case operations to succeed.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: '1. Code package (built with build.sh, uploaded to S3 in THIS account/region)' }
        Parameters: [CodeS3Bucket, CodeS3Key, CodeS3ObjectVersion]
      - Label: { default: '2. Identity provider for Kiro users' }
        Parameters: [IdentityProviderMode, OidcDiscoveryUrl, OidcClientId, OidcAudience, KiroCallbackPort, CognitoFirstUserEmail, SamlMetadataUrl, SamlProviderName]
      - Label: { default: '3. Naming' }
        Parameters: [RuntimeName, GatewayName]
    ParameterLabels:
      IdentityProviderMode: { default: 'IdP mode' }
      OidcDiscoveryUrl: { default: 'OIDC discovery URL (ExternalOIDC mode)' }
      OidcClientId: { default: 'OIDC client ID (ExternalOIDC mode)' }
      CognitoFirstUserEmail: { default: 'First user e-mail (Cognito mode, standalone users)' }
      SamlMetadataUrl: { default: 'SAML metadata URL of IAM Identity Center / SAML IdP (Cognito mode, federation)' }
      SamlProviderName: { default: 'SAML provider name (Cognito mode, federation)' }

Parameters:
  CodeS3Bucket:
    Type: String
    Description: S3 bucket (same account & region) holding support-mcp-agentcore.zip
  CodeS3Key:
    Type: String
    Default: support-mcp-agentcore.zip
  CodeS3ObjectVersion:
    Type: String
    Default: ''
    Description: >-
      Optional. S3 object version ID of the code package. Set it (deploy.sh does so automatically when the
      bucket has versioning enabled) so that re-uploading under the same key rolls the Runtime to the new
      package. Empty = the latest version of the object at deployment time.
  IdentityProviderMode:
    Type: String
    Default: ExternalOIDC
    AllowedValues: [ExternalOIDC, Cognito, DemoCognito]
    Description: >-
      ExternalOIDC = your corporate OIDC IdP (Okta/Entra/...): register a PUBLIC client (PKCE, no secret,
      redirect http://localhost:<port>/oauth/callback) and supply OidcDiscoveryUrl + OidcClientId.
      Cognito = a Cognito user pool created by this template, either with standalone users that administrators
      create (scripts/cognito-add-users.sh) or federated to IAM Identity Center / any SAML 2.0 IdP when
      SamlMetadataUrl is set. DemoCognito = the v1.0 name of the Cognito mode, still accepted.
  OidcDiscoveryUrl:
    Type: String
    Default: ''
    Description: e.g. https://<tenant>.okta.com/oauth2/default/.well-known/openid-configuration
  OidcClientId:
    Type: String
    Default: ''
    Description: >-
      OIDC client ID registered for Kiro (always required; emitted into the Kiro mcp.json output). Gateway validates it
      against the token's client_id claim unless OidcAudience is set (Okta puts the client ID in a cid claim, so set OidcAudience).
  OidcAudience:
    Type: String
    Default: ''
    Description: >-
      Optional. Expected aud claim of the access token (required for Okta; e.g. api://default or your
      custom authorization server audience). When set, the Gateway validates aud instead of client_id.
  KiroCallbackPort:
    Type: Number
    Default: 8080
    Description: Loopback port Kiro listens on for the OAuth redirect (Cognito mode registers it as callback URL)
  CognitoFirstUserEmail:
    Type: String
    Default: ''
    Description: >-
      (Cognito mode, standalone users) optional first user; Cognito e-mails a temporary password.
      Add more users with scripts/cognito-add-users.sh. Not used when SamlMetadataUrl is set.
  SamlMetadataUrl:
    Type: String
    Default: ''
    Description: >-
      (Cognito mode) optional. SAML 2.0 metadata URL of the IAM Identity Center customer managed application
      (or another SAML IdP) that signs users in. When set, the app client accepts federated sign-in only.
      Two-pass setup: deploy without it, create the SAML application in IAM Identity Center from the
      CognitoSamlAcsUrl / CognitoSamlAudience outputs, then update the stack with this URL.
  SamlProviderName:
    Type: String
    Default: IdentityCenter
    AllowedPattern: '^[A-Za-z][A-Za-z0-9._-]{0,31}$'
    Description: (Cognito mode, federation) name of the SAML provider inside the user pool; used as the prefix of federated usernames (<name>_<subject>)
  RuntimeName:
    Type: String
    Default: awsSupportMcp
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,47}$'
  GatewayName:
    Type: String
    Default: aws-support-mcp
    AllowedPattern: '^[0-9a-zA-Z][0-9a-zA-Z-]{0,47}$'

Conditions:
  UseCognito: !Or [!Equals [!Ref IdentityProviderMode, Cognito], !Equals [!Ref IdentityProviderMode, DemoCognito]]
  UseAudience: !And [!Not [!Condition UseCognito], !Not [!Equals [!Ref OidcAudience, '']]]
  CreateFirstUser: !And [!Condition UseCognito, !Not [!Equals [!Ref CognitoFirstUserEmail, '']]]
  UseSamlFederation: !And [!Condition UseCognito, !Not [!Equals [!Ref SamlMetadataUrl, '']]]
  HasCodeVersion: !Not [!Equals [!Ref CodeS3ObjectVersion, '']]

Rules:
  ExternalOidcNeedsValues:
    RuleCondition: !Equals [!Ref IdentityProviderMode, ExternalOIDC]
    Assertions:
      - Assert: !Not [!Equals [!Ref OidcDiscoveryUrl, '']]
        AssertDescription: OidcDiscoveryUrl is required in ExternalOIDC mode
      - Assert: !Not [!Equals [!Ref OidcClientId, '']]
        AssertDescription: OidcClientId is required in ExternalOIDC mode (Kiro needs it for the OAuth flow; for Okta also set OidcAudience so the Gateway validates aud instead of client_id)
  SamlNeedsCognitoMode:
    RuleCondition: !Not [!Equals [!Ref SamlMetadataUrl, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref IdentityProviderMode, ExternalOIDC]]
        AssertDescription: SamlMetadataUrl applies to Cognito mode only (in ExternalOIDC mode, federation is configured inside your own IdP)

Resources:
  # ---------------------------------------------------------------- Cognito user pool (Cognito / DemoCognito mode)
  # Logical IDs keep their v1.0 "Demo*" names so that stacks created with v1.0 update in place
  # (renaming them would replace the user pool and its domain).
  DemoUserPool:
    Type: AWS::Cognito::UserPool
    Condition: UseCognito
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-kiro-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true            # no self sign-up; federated users are still created on first sign-in
      Policies:
        PasswordPolicy: { MinimumLength: 12, RequireUppercase: true, RequireLowercase: true, RequireNumbers: true, RequireSymbols: false }
      UserPoolTier: ESSENTIALS

  DemoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: UseCognito
    Properties:
      UserPoolId: !Ref DemoUserPool
      Domain: !Sub
        - 'support-mcp-${Suffix}'
        - Suffix: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]

  CognitoSamlIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: UseSamlFederation
    Properties:
      UserPoolId: !Ref DemoUserPool
      ProviderName: !Ref SamlProviderName
      ProviderType: SAML
      ProviderDetails:
        MetadataURL: !Ref SamlMetadataUrl
      AttributeMapping:
        email: email                              # SAML attribute "email" (IAM Identity Center mapping ${user:email}) -> user pool email

  DemoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: UseCognito
    Properties:
      ClientName: kiro
      UserPoolId: !Ref DemoUserPool
      GenerateSecret: false                       # Kiro IDE supports public (PKCE) clients only
      SupportedIdentityProviders: !If
        - UseSamlFederation
        - [!Ref CognitoSamlIdentityProvider]      # federated sign-in only: the authorize endpoint redirects straight to the IdP; pool users cannot sign in
        - [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !Sub 'http://localhost:${KiroCallbackPort}/oauth/callback'
        - !Sub 'http://127.0.0.1:${KiroCallbackPort}/oauth/callback'
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }

  DemoUser:
    Type: AWS::Cognito::UserPoolUser
    Condition: CreateFirstUser
    Properties:
      UserPoolId: !Ref DemoUserPool
      Username: !Ref CognitoFirstUserEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - { Name: email, Value: !Ref CognitoFirstUserEmail }
        - { Name: email_verified, Value: 'true' }

  # ---------------------------------------------------------------- Runtime (hosts the MCP server)
  RuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-runtime-exec'
      Description: Assumed by AgentCore Runtime; the ONLY principal holding Support API permissions
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
              ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*' }
      Policies:
        - PolicyName: support-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SupportCaseLifecycle
                Effect: Allow
                Action:
                  - support:CreateCase
                  - support:DescribeCases
                  - support:DescribeCommunications
                  - support:AddCommunicationToCase
                  - support:ResolveCase
                  - support:AddAttachmentsToSet
                  - support:DescribeAttachment
                Resource: '*'
              - Sid: SupportCatalogLookups
                Effect: Allow
                Action:
                  - support:DescribeServices
                  - support:DescribeSeverityLevels
                  - support:DescribeCreateCaseOptions
                  - support:DescribeSupportedLanguages
                Resource: '*'
        - PolicyName: agentcore-runtime-baseline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CodePackage
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${CodeS3Bucket}/${CodeS3Key}'
              - Effect: Allow
                Action: [logs:DescribeLogStreams, logs:CreateLogGroup]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*'
              - Effect: Allow
                Action: [logs:PutResourcePolicy]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/${RuntimeName}-*'
              - Effect: Allow
                Action: [logs:DescribeLogGroups]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*'
              - Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, xray:GetSamplingRules, xray:GetSamplingTargets]
                Resource: '*'
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals: { 'cloudwatch:namespace': bedrock-agentcore }

  SupportMcpRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Ref RuntimeName
      Description: awslabs aws-support-mcp-server served over stateless streamable-HTTP
      RoleArn: !GetAtt RuntimeExecutionRole.Arn
      ProtocolConfiguration: MCP
      NetworkConfiguration: { NetworkMode: PUBLIC }
      AgentRuntimeArtifact:
        CodeConfiguration:
          Code:
            S3: !If
              - HasCodeVersion
              - { Bucket: !Ref CodeS3Bucket, Prefix: !Ref CodeS3Key, VersionId: !Ref CodeS3ObjectVersion }
              - { Bucket: !Ref CodeS3Bucket, Prefix: !Ref CodeS3Key }
          EntryPoint: [main.py]
          Runtime: PYTHON_3_12
      EnvironmentVariables:
        SUPPORT_API_REGION: us-east-1        # Support API endpoint lives in us-east-1 (aws partition)
        FASTMCP_LOG_LEVEL: INFO

  # ---------------------------------------------------------------- Gateway (JWT front door for Kiro)
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-gateway'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
              ArnLike: { 'aws:SourceArn': !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*' }
      Policies:
        - PolicyName: invoke-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !GetAtt SupportMcpRuntime.AgentRuntimeArn
                  - !Sub '${SupportMcpRuntime.AgentRuntimeArn}/*'

  SupportMcpGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: !Ref GatewayName
      Description: Kiro -> (OAuth JWT) -> Gateway -> (SigV4) -> Runtime-hosted AWS Support MCP
      ProtocolType: MCP
      RoleArn: !GetAtt GatewayRole.Arn
      AuthorizerType: CUSTOM_JWT
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !If
            - UseCognito
            - !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${DemoUserPool}/.well-known/openid-configuration'
            - !Ref OidcDiscoveryUrl
          AllowedClients: !If
            - UseAudience
            - !Ref AWS::NoValue
            - - !If [UseCognito, !Ref DemoUserPoolClient, !Ref OidcClientId]
          AllowedAudience: !If
            - UseAudience
            - [!Ref OidcAudience]
            - !Ref AWS::NoValue

  SupportMcpTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !GetAtt SupportMcpGateway.GatewayIdentifier
      Name: aws-support
      Description: AWS Support MCP server on AgentCore Runtime
      TargetConfiguration:
        Mcp:
          McpServer:
            Endpoint: !Sub
              - 'https://bedrock-agentcore.${AWS::Region}.amazonaws.com/runtimes/arn%3A${AWS::Partition}%3Abedrock-agentcore%3A${AWS::Region}%3A${AWS::AccountId}%3Aruntime%2F${RuntimeId}/invocations?qualifier=DEFAULT'
              - RuntimeId: !GetAtt SupportMcpRuntime.AgentRuntimeId
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE
          CredentialProvider:
            IamCredentialProvider:
              Service: bedrock-agentcore
              Region: !Ref AWS::Region

Outputs:
  GatewayUrl:
    Description: Put this in Kiro mcp.json as "url"
    Value: !GetAtt SupportMcpGateway.GatewayUrl
  OidcClientIdInUse:
    Description: Put this in Kiro mcp.json as oauth.clientId
    Value: !If [UseCognito, !Ref DemoUserPoolClient, !Ref OidcClientId]
  DiscoveryUrlInUse:
    Value: !If
      - UseCognito
      - !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${DemoUserPool}/.well-known/openid-configuration'
      - !Ref OidcDiscoveryUrl
  CognitoHostedDomain:
    Condition: UseCognito
    Value: !Sub 'https://${DemoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  CognitoUserPoolId:
    Condition: UseCognito
    Description: (Cognito mode) user pool ID; scripts/cognito-add-users.sh reads it from this output
    Value: !Ref DemoUserPool
  CognitoSamlAcsUrl:
    Condition: UseCognito
    Description: (Cognito mode) "Application ACS URL" to enter in the IAM Identity Center SAML 2.0 application
    Value: !Sub 'https://${DemoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/saml2/idpresponse'
  CognitoSamlAudience:
    Condition: UseCognito
    Description: (Cognito mode) "Application SAML audience" to enter in the IAM Identity Center SAML 2.0 application
    Value: !Sub 'urn:amazon:cognito:sp:${DemoUserPool}'
  RuntimeArn:
    Value: !GetAtt SupportMcpRuntime.AgentRuntimeArn
  RuntimeExecutionRoleArn:
    Description: The only principal with Support API permissions
    Value: !GetAtt RuntimeExecutionRole.Arn
  KiroMcpJson:
    Description: Paste into ~/.kiro/settings/mcp.json (or distribute via Kiro MCP Registry)
    Value: !Sub
      - '{"mcpServers":{"aws-support":{"url":"${Url}","oauth":{"clientId":"${Cid}","redirectUri":"localhost:${KiroCallbackPort}","oauthScopes":[${Scopes}]}}}}'
      - Url: !GetAtt SupportMcpGateway.GatewayUrl
        Cid: !If [UseCognito, !Ref DemoUserPoolClient, !Ref OidcClientId]
        Scopes: !If [UseCognito, '"openid","email","profile"', '"openid","email","profile","offline_access"']
